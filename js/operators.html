<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    
    <script>
        let a=10;
        let b=20;
        var c=a+b;   
        var d=a-b;
        var e=a*b;
        var f=a/b;
        var g=a>b;
        var h=a<b;
        var i=a==b;
        var j=a!=b;
        var k=a>=b;
        var l=a<=b;

        alert(c);
        alert(d);
        alert(e);
        alert(f);
        alert(g);
        alert(h);
        alert(i);
        alert(j);
        alert(k);
        alert(l);
    </script>
</body>
</html>
