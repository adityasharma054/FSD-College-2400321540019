<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    
    <script>
        let a=10;
        let b=20;
        var c=a+b;
        var d=a-b;
        var e=a*b;
        var f=a/b;

        alert(c);
        alert(d);
        alert(e);
        alert(f);
    </script>
</body>
</html>
